<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stołownik</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff9ef;color:#28231e;font:15px system-ui}header{padding:28px 20px;border-bottom:1px solid #eadccb;background:#fffdf8}main,header>div{max-width:1120px;margin:auto}h1,h2,h3{font-family:Georgia,serif}h1{font-size:42px;margin:0;color:#9b382b}header p{color:#756c63}.search{display:flex;gap:10px;margin:28px 0 15px}.search input{flex:1;padding:15px 18px;border:1px solid #dfd0bd;border-radius:14px;background:white;font-size:16px}.surprise,.open{border:0;border-radius:13px;background:#365d45;color:#fff;padding:13px 17px;font-weight:800}.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}.cat{border:1px solid #dfd0bd;background:#fff;border-radius:999px;padding:9px 13px}.cat.active{background:#9b382b;color:#fff;border-color:#9b382b}.count{font-weight:800;margin:0 0 15px;color:#365d45}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:50px}.card{background:#fff;border:1px solid #e5d8c7;border-radius:20px;overflow:hidden}.card img{width:100%;height:220px;object-fit:cover;background:#eee}.pad{padding:16px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:11px;background:#f3eadc;padding:5px 8px;border-radius:99px}.card h3{font-size:23px;margin:10px 0 6px}.card p{color:#756c63;line-height:1.45}.modal{display:none;position:fixed;inset:0;background:#17130fbb;z-index:20;padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}.sheet{max-width:760px;width:100%;max-height:92vh;overflow:auto;background:#fffdf8;border-radius:22px;position:relative}.sheet>img{width:100%;height:330px;object-fit:cover}.inside{padding:24px}.close{position:absolute;right:12px;top:12px;border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:22px}.cols{display:grid;grid-template-columns:1fr 1.25fr;gap:25px}.cols li{margin:9px 0;line-height:1.45}.note{padding:13px;background:#eef4ee;border-left:4px solid #365d45;border-radius:9px;margin-top:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}.search{flex-direction:column}.cols{grid-template-columns:1fr}.sheet>img{height:240px}}
</style></head><body><header><div><h1>Stołownik</h1><p>Mały katalog. Prawdziwe kategorie. Każde zdjęcie pokazuje dokładnie danie z karty.</p></div></header><main>
<div class="search"><input id="q" placeholder="Szukaj dania lub składnika…"><button class="surprise" onclick="surprise()">Zaskocz mnie</button></div>
<div class="cats" id="cats"></div><p class="count" id="count"></p><section class="grid" id="grid"></section></main>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><article class="sheet"><button class="close" onclick="closeM()">×</button><img id="mi"><div class="inside"><div class="tags" id="mt"></div><h2 id="mn"></h2><p id="md"></p><div class="cols"><div><h3>Składniki — 1 porcja</h3><ul id="ming"></ul></div><div><h3>Przygotowanie</h3><ol id="mst"></ol></div></div><div class="note">Wskazówka: przygotuj i odmierz wszystkie składniki przed rozpoczęciem gotowania.</div></div></article></div>
<script>
const R=[{"id": 1, "name": "Jajecznica ze szczypiorkiem", "cats": ["Śniadania", "Wegetariańskie", "Szybkie"], "time": 10, "img": "https://mills.no/content/uploads/sites/2/2017/05/EggerC3B8re.jpg", "desc": "Kremowa jajecznica ze świeżym szczypiorkiem i pieczywem.", "ingredients": ["3 jajka", "1 łyżeczka masła", "2 łyżki szczypiorku", "2 kromki pieczywa", "sól i pieprz"], "steps": ["Roztrzep jajka tylko do połączenia białek z żółtkami.", "Rozpuść masło na małym ogniu i wlej jajka.", "Mieszaj łopatką 2–3 minuty; zdejmij patelnię, gdy jajka są jeszcze lekko kremowe.", "Dopraw i posyp szczypiorkiem. Podaj od razu z pieczywem."]}, {"id": 2, "name": "Zupa pomidorowa z makaronem", "cats": ["Zupy", "Obiady", "Wegetariańskie"], "time": 25, "img": "https://polishfoodies.com/wp-content/uploads/2020/05/zupa-pomidorowa.jpeg", "desc": "Domowa pomidorowa z makaronem, śmietanką i natką pietruszki.", "ingredients": ["400 ml bulionu warzywnego", "250 ml passaty pomidorowej", "60 g makaronu", "30 ml śmietanki 12%", "1 łyżka natki pietruszki", "sól i pieprz"], "steps": ["Bulion połącz z passatą i gotuj spokojnie 10 minut.", "Makaron ugotuj osobno al dente.", "Śmietankę zahartuj kilkoma łyżkami gorącej zupy i wlej do garnka.", "Dopraw. Do miski włóż makaron, zalej zupą i dodaj natkę."]}, {"id": 3, "name": "Pierogi ruskie z cebulką", "cats": ["Obiady", "Wegetariańskie"], "time": 60, "img": "https://images.ctfassets.net/jpo18ojnqq5r/2MWY5X0vDn9JOVTbxfAMup/00d735f6ad663cea5f24d4a215968607/pierogi_ruskie.jpg", "desc": "Miękkie pierogi z farszem ziemniaczano-twarogowym i złotą cebulką.", "ingredients": ["150 g mąki pszennej", "80 ml gorącej wody", "180 g ziemniaków", "100 g twarogu półtłustego", "1/2 cebuli", "1 łyżeczka masła", "sól i pieprz"], "steps": ["Z mąki, wody i szczypty soli zagnieć miękkie ciasto. Przykryj na 20 minut.", "Ugotowane ziemniaki rozgnieć i połącz z twarogiem oraz połową podsmażonej cebuli.", "Ciasto cienko rozwałkuj, wytnij krążki, nałóż farsz i mocno zlep brzegi.", "Gotuj partiami 2–3 minuty od wypłynięcia. Podaj z pozostałą cebulką."]}, {"id": 4, "name": "Kotlet schabowy z ziemniakami i surówką", "cats": ["Obiady", "Mięsne", "Polskie klasyki"], "time": 40, "img": "https://tn.com.ar/resizer/v2/la-chuleta-de-cerdo-empanizada-conocida-como-kotlet-schabowy-es-uno-de-los-platos-polacos-mas-populares-foto-tasteatlas-5UY7QQOVHRF65NYZXXY2WBK6PM.jpg?auth=3f24a360129f25260dc21d27e1e985d5261083bd13b9227914c9e38de4cc8deb&width=767", "desc": "Klasyczny chrupiący schabowy, gotowane ziemniaki i świeża surówka z kapusty.", "ingredients": ["180 g schabu bez kości", "1 jajko", "30 g bułki tartej", "15 g mąki", "250 g ziemniaków", "120 g białej kapusty", "1/2 marchewki", "1 łyżeczka soku z cytryny", "olej do smażenia", "sól i pieprz"], "steps": ["Ziemniaki obierz i ugotuj w osolonej wodzie do miękkości.", "Schab rozbij na równą grubość, dopraw. Obtocz kolejno w mące, jajku i bułce tartej.", "Smaż na rozgrzanym tłuszczu po około 3–4 minuty z każdej strony.", "Kapustę cienko poszatkuj, marchew zetrzyj, dodaj sok z cytryny, sól i pieprz. Podaj wszystko razem."]}, {"id": 5, "name": "Rosół z makaronem", "cats": ["Zupy", "Obiady", "Mięsne", "Polskie klasyki"], "time": 105, "img": "https://static.fajnegotowanie.pl/media/uploads/media_image/original/przepis/1076/rosol-z-kury.jpg", "desc": "Klarowny, długo gotowany rosół z warzywami i cienkim makaronem.", "ingredients": ["300 g kurczaka z kością", "1 marchew", "1/2 pietruszki", "kawałek selera", "1/2 cebuli", "1 l zimnej wody", "60 g makaronu", "natka pietruszki", "sól i pieprz"], "steps": ["Kurczaka zalej zimną wodą i bardzo powoli podgrzewaj. Zbierz szumowiny.", "Dodaj warzywa i przypaloną na suchej patelni cebulę.", "Gotuj 75–90 minut na minimalnym ogniu — rosół nie powinien mocno bulgotać.", "Dopraw pod koniec. Podaj z osobno ugotowanym makaronem, marchewką i natką."]}, {"id": 6, "name": "Leczo warzywne", "cats": ["Obiady", "Wegetariańskie", "Jednogarnkowe"], "time": 30, "img": "https://www.mojegotowanie.pl/media/cache/crop/rc/zqAE0UFl/uploads/media/default/0002/49/leczo-do-sloikow-duszenie.jpg", "desc": "Soczyste leczo z papryką, cukinią, cebulą i pomidorami.", "ingredients": ["1 czerwona papryka", "1/2 żółtej papryki", "1/2 cukinii", "1/2 cebuli", "300 g krojonych pomidorów", "1 łyżeczka oliwy", "1/2 łyżeczki słodkiej papryki", "sól i pieprz"], "steps": ["Cebulę zeszklij na oliwie.", "Dodaj paprykę i smaż 5 minut, potem dodaj cukinię.", "Dodaj pomidory i słodką paprykę. Duś bez przykrycia 15–18 minut.", "Dopraw dopiero pod koniec, gdy sos już zgęstnieje."]}, {"id": 7, "name": "Pieczony kurczak z ziemniakami", "cats": ["Obiady", "Mięsne", "Z piekarnika"], "time": 60, "img": "https://staticsmaker.iplsc.com/smaker_production_2026_02_11/b8c0d0cfa98072975bc7e17e3f7f5b65-content.jpg", "desc": "Rumiany kurczak z ziołami i ziemniakami pieczonymi w tym samym naczyniu.", "ingredients": ["1 mały kurczak lub 2 duże udka", "350 g ziemniaków", "1 łyżka oleju", "1 łyżeczka słodkiej papryki", "1/2 łyżeczki czosnku granulowanego", "rozmaryn", "sól i pieprz"], "steps": ["Piekarnik rozgrzej do 205°C. Kurczaka dokładnie osusz i natrzyj przyprawami.", "Ziemniaki pokrój w równe kawałki, wymieszaj z olejem, solą i rozmarynem.", "Ułóż mięso i ziemniaki w naczyniu; piecz około 45–55 minut.", "Przed podaniem upewnij się, że mięso przy kości jest całkowicie dopieczone."]}], C=["Wszystkie", "Śniadania", "Obiady", "Zupy", "Wegetariańskie", "Mięsne", "Szybkie", "Polskie klasyki", "Jednogarnkowe", "Z piekarnika"]; let cat="Wszystkie",q="";
const norm=s=>s.toLocaleLowerCase("pl-PL").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function filt(){return R.filter(r=>(cat==="Wszystkie"||r.cats.includes(cat))&&(!q||norm([r.name,r.desc,...r.ingredients].join(" ")).includes(norm(q))))}
function drawCats(){cats.innerHTML=C.map(x=>`<button class="cat ${x===cat?"active":""}" onclick="setCat('${x}')">${x} <b>${x==="Wszystkie"?R.length:R.filter(r=>r.cats.includes(x)).length}</b></button>`).join("")}
function setCat(x){cat=x;drawCats();draw()}
function draw(){let a=filt();count.textContent=`${a.length} ${a.length===1?"danie":"dań"}`;grid.innerHTML=a.map(r=>`<article class="card"><img src="${r.img}" alt="${r.name}"><div class="pad"><div class="tags">${r.cats.map(x=>`<span class="tag">${x}</span>`).join("")}</div><h3>${r.name}</h3><p>${r.desc}</p><p><b>${r.time} min</b></p><button class="open" onclick="openR(${r.id})">Zobacz przepis</button></div></article>`).join("")||"<p>Brak wyników — spróbuj innej nazwy albo kategorii.</p>"}
function openR(id){let r=R.find(x=>x.id===id);mi.src=r.img;mi.alt=r.name;mn.textContent=r.name;md.textContent=r.desc;mt.innerHTML=r.cats.map(x=>`<span class="tag">${x}</span>`).join("");ming.innerHTML=r.ingredients.map(x=>`<li>${x}</li>`).join("");mst.innerHTML=r.steps.map(x=>`<li>${x}</li>`).join("");modal.classList.add("show");document.body.style.overflow="hidden"}
function closeM(){modal.classList.remove("show");document.body.style.overflow=""}
function surprise(){let a=filt();if(!a.length)a=R;openR(a[Math.floor(Math.random()*a.length)].id)}
document.getElementById("q").oninput=e=>{q=e.target.value;draw()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});drawCats();draw();
</script></body></html>
