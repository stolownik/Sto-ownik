name: Stołownik quality
on:
  push:
    paths: ['index.html','stolownik-world.css','stolownik-app-v5.js','stolownik-experience.js','stolownik-platform.js','stolownik-recipes.js','stolownik-world-recipes.js','stolownik-drinks.js','manifest.webmanifest','sw.js','.github/workflows/apply-recipe-fixes.yml']
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check stolownik-app-v5.js
          node --check stolownik-experience.js
          node --check stolownik-platform.js
          node --check stolownik-recipes.js
          node --check stolownik-world-recipes.js
          node --check stolownik-drinks.js
          node --check sw.js
      - name: Platform invariants
        run: |
          grep -q 'G-ZDFQ37XBFQ' index.html
          grep -q 'https://stolownik.github.io/Sto-ownik/' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'stolownik-platform.js?v=1' index.html
          grep -q 'data-type="Dania"' index.html
          grep -q 'data-type="Desery"' index.html
          grep -q 'data-type="Napoje"' index.html
          grep -q 'id="ingredientBtn"' index.html
          grep -q 'id="authModal"' index.html
          ! grep -q 'catalog-mirror-v29.js' index.html
          ! grep -q 'catalog-sync-v38.js' index.html
          echo 'Stołownik: testy jakości przeszły.'