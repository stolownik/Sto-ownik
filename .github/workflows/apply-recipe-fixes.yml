name: Apply recipe fixes
on:
  push:
    paths:
      - 'recipe-fixes.js'
      - 'advisor.js'
      - '.github/workflows/apply-recipe-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect current features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=re.sub(r'<script src="recipe-fixes\.js(?:\?v=[^"]*)?"></script>', '<script src="recipe-fixes.js?v=8"></script>', s)
          if 'recipe-fixes.js?v=8' not in s:
              s=s.replace('</body>','<script src="recipe-fixes.js?v=8"></script></body>')
          s=re.sub(r'<script src="advisor\.js(?:\?v=[^"]*)?"></script>', '', s)
          s=s.replace('</body>','<script src="advisor.js?v=1"></script></body>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Podłącz profesjonalnego doradcę posiłków'
          git push