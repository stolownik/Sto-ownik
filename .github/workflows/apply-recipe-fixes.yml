name: Apply recipe fixes
on:
  push:
    paths:
      - 'recipe-fixes.js'
      - 'recipes-26-50.js'
      - 'recipes-render-fix-v5.js'
      - 'recipe-ux-v7.js'
      - 'recipe-extras-v8.js'
      - '.github/workflows/apply-recipe-fixes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep recipes and remove old advisor modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          names=['recipe-fixes.js','advisor.js','advisor-pro.js','advisor-fitness-v4.js','advisor-gym-pro-v5.js','advisor-hub-v6.js','recipes-26-50.js','recipes-live-fix.js','recipes-render-fix-v5.js','recipe-ux-v7.js','recipe-extras-v8.js']
          for name in names:
              s=re.sub(r'<script src="'+re.escape(name)+r'(?:\?v=[^"]*)?"></script>', '', s)
          s=s.replace('</body>','<script src="recipes-26-50.js?v=6"></script><script src="recipe-fixes.js?v=8"></script><script src="recipes-render-fix-v5.js?v=6"></script><script src="recipe-ux-v7.js?v=1"></script><script src="recipe-extras-v8.js?v=1"></script></body>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Usuń stare moduły Doradcy i Gym'
          git push