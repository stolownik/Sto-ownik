name: Stołownik World quality
on:
  push:
    paths: ['index.html','stolownik-world.css','stolownik-world.js','.github/workflows/apply-recipe-fixes.yml']
  pull_request:
    paths: ['index.html','stolownik-world.css','stolownik-world.js']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check stolownik-world.js
      - name: Architecture invariants
        run: |
          grep -q 'stolownik-world.css?v=1' index.html
          grep -q 'stolownik-world.js?v=2' index.html
          grep -q 'G-ZDFQ37XBFQ' index.html
          grep -q 'https://stolownik.github.io/Sto-ownik/' index.html
          ! grep -q 'catalog-mirror-v29.js' index.html
          ! grep -q 'catalog-sync-v38.js' index.html
          ! grep -q 'ux-general-v61.js' index.html
          grep -q 'data-type="Dania"' index.html
          grep -q 'data-type="Desery"' index.html
          grep -q 'data-type="Napoje"' index.html
          grep -q 'id="authModal"' index.html
          grep -q 'stolownik:pantry' stolownik-world.js
          grep -q 'stolownik:saved' stolownik-world.js
          grep -q 'function pantry' stolownik-world.js
          grep -q 'function planner' stolownik-world.js
          echo 'Stołownik World v2: testy architektury przeszły.'