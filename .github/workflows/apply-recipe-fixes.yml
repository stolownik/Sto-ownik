name: Stołownik quality
on:
  push:
    paths: ['index.html','stolownik-world.css','stolownik-app-v6.js','stolownik-final-v1.js','stolownik-recipes.js','stolownik-world-recipes.js','stolownik-world-recipes-extended.js','stolownik-world-recipes-complete.js','stolownik-drinks.js','manifest.webmanifest','sw.js','.github/workflows/apply-recipe-fixes.yml']
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check stolownik-app-v6.js
          node --check stolownik-final-v1.js
          node --check stolownik-recipes.js
          node --check stolownik-world-recipes.js
          node --check stolownik-world-recipes-extended.js
          node --check stolownik-world-recipes-complete.js
          node --check stolownik-drinks.js
          node --check sw.js
      - name: Recipe data integrity
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}};vm.createContext(ctx);
          for(const f of ['stolownik-recipes.js','stolownik-world-recipes.js','stolownik-world-recipes-extended.js','stolownik-world-recipes-complete.js','stolownik-drinks.js']) vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:f});
          const r=ctx.window.STOLOWNIK_RECIPES||[], ids=r.map(x=>x.id), dup=[...new Set(ids.filter((x,i)=>ids.indexOf(x)!==i))];
          if(dup.length) throw Error('Duplicate recipe IDs: '+dup.join(','));
          const bad=r.filter(x=>!Number.isInteger(x.id)||!x.name||!['Dania','Desery','Napoje'].includes(x.type)||!Number.isFinite(+x.time)||!Array.isArray(x.ingredients)||!x.ingredients.length||!Array.isArray(x.steps)||!x.steps.length);
          if(bad.length) throw Error('Invalid recipes: '+bad.map(x=>x.id).join(','));
          for(let id=51;id<=100;id++) if(!ids.includes(id)) throw Error('Missing World recipe '+id);
          for(let id=201;id<=218;id++) if(!ids.includes(id)) throw Error('Missing drink '+id);
          if(ids.includes(200)) throw Error('Legacy drink ID 200 must not exist');
          console.log(`Validated ${r.length} recipes; unique IDs and required fields OK.`);
          NODE
      - name: Platform invariants
        run: |
          grep -q 'G-ZDFQ37XBFQ' index.html
          grep -q 'https://stolownik.github.io/Sto-ownik/' index.html
          grep -q 'manifest.webmanifest' index.html
          grep -q 'stolownik-app-v6.js?v=2' index.html
          grep -q 'stolownik-final-v1.js?v=1' index.html
          grep -q 'id="brandsBtn"' index.html
          grep -q 'id="partnersBtn"' index.html
          grep -q 'id="restaurantBtn"' index.html
          grep -q 'id="atlasBtn"' index.html
          grep -q 'id="weekBtn"' index.html
          grep -q 'data-type="Dania"' index.html
          grep -q 'data-type="Desery"' index.html
          grep -q 'data-type="Napoje"' index.html
          grep -q 'Europe/Warsaw' stolownik-app-v6.js
          grep -q 'Restaurant Studio' stolownik-app-v6.js
          grep -q 'Ingredient Universe' stolownik-app-v6.js
          grep -q 'CC BY-SA 4.0' stolownik-final-v1.js
          ! grep -q 'stolownik-app-v5.js' index.html
          ! grep -q 'stolownik-experience.js' index.html
          ! grep -q 'stolownik-platform.js' index.html
          ! grep -q 'stolownik-catalog-pro.js' index.html
          ! grep -q 'stolownik-75.js' index.html
          ! grep -q 'MutationObserver' stolownik-app-v6.js
          ! grep -q 'MutationObserver' stolownik-final-v1.js
          echo 'Stołownik: finalny audyt statyczny przeszedł.'