name: Stołownik Atlas quality
on:
  push:
    paths: ['index.html', 'sw.js', 'atlas/**', '.github/workflows/apply-recipe-fixes.yml']
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and published page
        run: |
          node --check atlas/app.js
          node --check atlas/tools/import-catalog.mjs
          node --check atlas/tools/build-shards.mjs
          node --check atlas/tools/audit-catalog.mjs
          node --check sw.js
          node atlas/tools/check-published.mjs
      - name: Recipe and user-flow checks
        run: |
          node atlas/tools/test-catalog.mjs
          node atlas/tools/smoke.mjs
